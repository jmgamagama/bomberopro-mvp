name: staging-db-check
# Prueba de conexión de SOLO LECTURA contra staging. Se lanza al subir la rama claude/staging-db-check.
on:
  push:
    branches: [claude/staging-db-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar conexión y que es staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_DB_URL:-}" ]; then echo "FALLO: el secreto STAGING_DB_URL está vacío o no existe"; exit 1; fi
          case "$STAGING_DB_URL" in *"[YOUR-"*|*"YOUR-PASSWORD"*) echo "FALLO: la cadena aún contiene el marcador [YOUR-PASSWORD]"; exit 1;; esac
          out=$(psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -At -F '|' -c "select current_user, (select count(*) from public.topics), (select max(version) from supabase_migrations.schema_migrations)" 2>&1) || { echo "FALLO de conexión:"; echo "$out" | sed -E 's#(postgres(ql)?://[^:]+:)[^@]+@#\1***@#g'; exit 1; }
          echo "Resultado (usuario|temas|última migración): $out"
          case "$STAGING_DB_URL" in *fxhvgvehhekqeqpkxtrm*) ;; *) echo "FALLO: la cadena no apunta al proyecto de staging, se detiene"; exit 1;; esac
          topics=$(echo "$out" | cut -d'|' -f2)
          if [ "$topics" -gt 10 ]; then echo "FALLO: tiene $topics temas, parece producción, se detiene"; exit 1; fi
          echo "OK: es la base de datos de STAGING"
