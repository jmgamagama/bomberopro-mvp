name: Access browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/acceso-dos-pestanas.yml'
      - 'e2e/adversarial-acceso-dos-pestanas-360.cjs'
      - 'src/components/Login*'
      - 'src/lib/authSessionGuard*'
      - 'src/lib/supabase.ts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/acceso-dos-pestanas.yml'
      - 'e2e/adversarial-acceso-dos-pestanas-360.cjs'
      - 'src/components/Login*'
      - 'src/lib/authSessionGuard*'
      - 'src/lib/supabase.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: access-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Two tabs with synthetic Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:9
      VITE_SUPABASE_ANON_KEY: e2e
      BASE_URL: http://127.0.0.1:4318

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/access-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/access-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/access-browser/node_modules" >> "$GITHUB_ENV"
      - name: Build with synthetic backend
        run: npm run build
      - name: Run versioned browser acceptance
        shell: bash
        run: |
          mkdir -p browser-evidence
          git rev-parse HEAD | tee browser-evidence/checkout.txt
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4318 --strictPort > browser-evidence/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent "$BASE_URL/" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat browser-evidence/preview.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat browser-evidence/preview.log
            exit 1
          fi
          node e2e/adversarial-acceso-dos-pestanas-360.cjs 2>&1 | tee browser-evidence/acceptance.log
      - name: Preserve synthetic acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-browser-${{ github.run_id }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
