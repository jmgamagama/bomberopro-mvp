name: audit-content-quarantine
on:
  pull_request:
    paths:
      - 'supabase/migrations/25_audit_content_quarantine*.sql'
      - 'supabase/tests/audit_quarantine.pglite.mjs'
      - 'supabase/tests/fixtures/**'
      - '.github/workflows/audit-content-quarantine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Postgres runtime
        run: npm install --prefix "$RUNNER_TEMP/audit-runtime" --no-save --ignore-scripts @electric-sql/pglite@0.5.11
      - name: Test migration and rollback with fixtures
        run: NODE_PATH="$RUNNER_TEMP/audit-runtime/node_modules" node supabase/tests/audit_quarantine.pglite.mjs
      - name: Validate migration numbers
        run: node scripts/check-migrations.mjs
