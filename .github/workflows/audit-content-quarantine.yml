name: audit-content-quarantine
on:
  pull_request:
    paths:
      - 'supabase/migrations/25_audit_content_quarantine*.sql'
      - 'supabase/migrations/30_audit_critical_quarantine*.sql'
      - 'supabase/migrations/35_todas_anteriores_incoherentes*.sql'
      - 'supabase/migrations/36_endurecer_permisos_anon*.sql'
      - 'supabase/migrations/43_auditoria_200_fase1*.sql'
      - 'supabase/tests/auditoria_200_f1.pglite.mjs'
      - 'supabase/migrations/46_auditoria_temas_35_40*.sql'
      - 'supabase/tests/auditoria_temas_35_40_f1b.pglite.mjs'
      - 'supabase/tests/audit_35_36.pglite.mjs'
      - 'supabase/tests/audit_quarantine.pglite.mjs'
      - 'supabase/tests/audit_critical.pglite.mjs'
      - 'supabase/tests/fixtures/**'
      - '.github/workflows/audit-content-quarantine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Postgres runtime
        run: npm install --prefix "$RUNNER_TEMP/audit-runtime" --no-save --ignore-scripts @electric-sql/pglite@0.5.11
      - name: Test migration and rollback with fixtures
        run: NODE_PATH="$RUNNER_TEMP/audit-runtime/node_modules" node supabase/tests/audit_quarantine.pglite.mjs
      - name: Test critical-content migration 30 and rollback
        run: NODE_PATH="$RUNNER_TEMP/audit-runtime/node_modules" node supabase/tests/audit_critical.pglite.mjs
      - name: Test migrations 35 and 36 and rollback
        run: NODE_PATH="$RUNNER_TEMP/audit-runtime/node_modules" node supabase/tests/audit_35_36.pglite.mjs
      - name: Test migration 43 (audit 200, phase 1) and rollback
        run: NODE_PATH="$RUNNER_TEMP/audit-runtime/node_modules" node supabase/tests/auditoria_200_f1.pglite.mjs
      - name: Test migration 46 (audit topics 35-40, duplicates and medium findings) and rollback
        run: NODE_PATH="$RUNNER_TEMP/audit-runtime/node_modules" node supabase/tests/auditoria_temas_35_40_f1b.pglite.mjs
      - name: Validate migration numbers
        run: node scripts/check-migrations.mjs
