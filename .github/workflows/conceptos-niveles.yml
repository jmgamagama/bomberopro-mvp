name: conceptos-niveles
on:
  pull_request:
    paths:
      - 'supabase/migrations/49_conceptos_por_niveles*.sql'
      - 'supabase/migrations/50_sesion_por_niveles*.sql'
      - 'supabase/tests/sesion_niveles_50.pglite.mjs'
      - 'supabase/tests/conceptos_niveles_49.pglite.mjs'
      - '.github/workflows/conceptos-niveles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Postgres runtime
        run: npm install --prefix "$RUNNER_TEMP/pg-runtime" --no-save --ignore-scripts @electric-sql/pglite@0.5.11
      - name: Test levels-by-block session, guard and rollback
        run: NODE_PATH="$RUNNER_TEMP/pg-runtime/node_modules" node supabase/tests/conceptos_niveles_49.pglite.mjs
      - name: Test question session by levels (50)
        run: NODE_PATH="$RUNNER_TEMP/pg-runtime/node_modules" node supabase/tests/sesion_niveles_50.pglite.mjs
      - name: Validate migration numbers
        run: node scripts/check-migrations.mjs
