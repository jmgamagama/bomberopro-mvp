name: PR review findings gate

# Complementa Quality Gate: lint/build/tests no detectan observaciones Codex sin resolver.
# Este workflow debe marcarse como required status check en protección de main.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-findings:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Block unresolved review threads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const name = context.repo.repo;
            const number = context.issue.number;
            let cursor = null;
            const unresolved = [];
            do {
              const data = await github.graphql(`
                query($owner:String!, $name:String!, $number:Int!, $after:String) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      reviewThreads(first:100, after:$after) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first:1) { nodes { url path body } }
                        }
                      }
                    }
                  }
                }`, {owner, name, number, after:cursor});
              const threads = data.repository?.pullRequest?.reviewThreads;
              if (!threads) core.setFailed('No se pudo leer la revisión de la PR');
              for (const thread of threads.nodes) {
                if (!thread.isResolved && !thread.isOutdated) {
                  const first = thread.comments.nodes[0];
                  unresolved.push(first?.url || first?.path || '(sin enlace)');
                }
              }
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (cursor);
            if (unresolved.length) {
              core.setFailed(`Hay ${unresolved.length} hilo(s) de revisión sin resolver: ${unresolved.join(', ')}. Corregir o documentar y resolver tras revisión.`);
            } else {
              core.info('No hay hilos de revisión vigentes sin resolver.');
            }
