name: Study summary browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/aceptacion-visual-300.yml'
      - 'e2e/aceptacion-visual-300.cjs'
      - 'src/components/ConceptStudy.tsx'
      - 'src/components/ReportQuestionButton.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:9
      VITE_SUPABASE_ANON_KEY: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-300" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/visual-300/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/visual-300/node_modules" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run synthetic desktop and mobile acceptance
        shell: bash
        run: |
          mkdir -p browser-evidence
          git rev-parse HEAD | tee browser-evidence/checkout.txt
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4314 --strictPort > browser-evidence/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4314/ > /dev/null; then ready=true; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat browser-evidence/preview.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat browser-evidence/preview.log; exit 1; fi
          node e2e/aceptacion-visual-300.cjs 2>&1 | tee browser-evidence/acceptance.log
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-summary-visual-${{ github.run_id }}
          path: |
            browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
