name: Dashboard acceptance
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/Dashboard*'
      - 'src/lib/useRemoteConceptProgress*'
      - 'scripts/qa-dashboard.mjs'
      - '.github/workflows/dashboard-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: dashboard-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.head_ref == 'codex/fix-dashboard-remote-progress'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify Dashboard with labelled QA account and production backend
        run: node scripts/qa-dashboard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-evidence
          path: qa-dashboard.json
