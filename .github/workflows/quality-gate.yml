name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview environment isolation
        run: npx vitest run scripts/check-preview-isolation.test.mjs --configLoader runner

      - name: Migraciones sin números repetidos
        run: node scripts/check-migrations.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: SQL engine tests (PGlite)
        run: |
          npm i --no-save @electric-sql/pglite
          node supabase/tests/concept_engine.pglite.mjs
          node supabase/tests/concept_answer_secure.pglite.mjs
          node supabase/tests/escalera.pglite.mjs
          node supabase/tests/carga_conceptos.pglite.mjs
          node supabase/tests/vinculos.pglite.mjs
