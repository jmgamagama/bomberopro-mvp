name: Concept session repetition regression
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/concept_session_repeats_299.pglite.mjs'
      - '.github/workflows/concept-session-repeats.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repetition-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Postgres runtime
        run: npm install --prefix "$RUNNER_TEMP/pg-runtime" --no-save --ignore-scripts @electric-sql/pglite@0.5.11
      - name: Audit consecutive sessions with synthetic data
        run: NODE_PATH="$RUNNER_TEMP/pg-runtime/node_modules" node supabase/tests/concept_session_repeats_299.pglite.mjs
      - name: Verify baseline reproduces the regression
        shell: bash
        run: |
          set +e
          NODE_PATH="$RUNNER_TEMP/pg-runtime/node_modules" node supabase/tests/concept_session_repeats_299.pglite.mjs --baseline --assert-refuerzo-once > "$RUNNER_TEMP/refuerzo-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/refuerzo-negative.log"
          test "$result" -ne 0
          grep -F 'N2 correcto vuelve antes de due_at por el mismo fallo N3' "$RUNNER_TEMP/refuerzo-negative.log"
